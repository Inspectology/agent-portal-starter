<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#a90533">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IVY">
    <title>IVY | Inspectology</title>
    <link rel="icon" href="/assets/inspectology-app.svg" type="image/svg+xml">
    <link rel="manifest" href="/ivy.webmanifest">
    <link rel="stylesheet" href="/ivy.css">
  </head>
  <body>
    <main class="ivy-shell">
      <section id="loginView" class="ivy-login-card">
        <img class="ivy-logo" src="https://static.wixstatic.com/media/4b52f0_0a206cfa3f764d989adbe9a349b1d320~mv2.png" alt="Inspectology">
        <span class="ivy-kicker">Inspectology Staff</span>
        <h1>Meet IVY</h1>
        <p class="ivy-muted">Your Inspectology Virtual Operations Assistant.</p>

        <form id="emailForm" class="ivy-form">
          <label>
            <span>Inspectology email</span>
            <input id="emailInput" type="email" autocomplete="email" placeholder="name@inspect-ology.com" required>
          </label>
          <button type="submit" class="ivy-primary">Send sign-in code</button>
        </form>

        <form id="codeForm" class="ivy-form" hidden>
          <p class="ivy-muted">Enter the 6-digit code sent to <strong id="codeEmail"></strong>.</p>
          <label>
            <span>Sign-in code</span>
            <input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
          </label>
          <button type="submit" class="ivy-primary">Sign in</button>
          <button id="changeEmail" type="button" class="ivy-ghost">Use a different email</button>
        </form>

        <p id="loginMessage" class="ivy-message" aria-live="polite"></p>
      </section>

      <section id="appView" class="ivy-app" hidden>
        <header class="ivy-topbar">
          <div>
            <span class="ivy-kicker">Inspectology</span>
            <h1>IVY</h1>
          </div>
          <div class="ivy-top-actions">
            <button id="installButton" type="button" class="ivy-icon-button" hidden aria-label="Install IVY">＋</button>
            <button id="refreshButton" type="button" class="ivy-icon-button" aria-label="Refresh">↻</button>
          </div>
        </header>

        <section class="ivy-command-card">
          <div class="ivy-command-heading">
            <div>
              <span class="ivy-section-label">Ask IVY</span>
              <h2>What do you need?</h2>
            </div>
            <button id="voiceButton" type="button" class="ivy-voice-button" aria-label="Dictate a command">🎙</button>
          </div>

          <form id="commandForm">
            <textarea id="commandInput" rows="4" maxlength="800" placeholder="Try: What reports came in today?"></textarea>
            <div class="ivy-command-actions">
              <span id="voiceStatus" class="ivy-muted"></span>
              <button type="submit" class="ivy-primary ivy-send-button">Ask IVY</button>
            </div>
          </form>

          <div id="conversation" class="ivy-conversation" aria-live="polite"></div>
        </section>

        <section class="ivy-section">
          <div class="ivy-section-heading">
            <div>
              <span class="ivy-section-label">Needs Attention</span>
              <h2>Open exceptions</h2>
            </div>
            <span id="exceptionCount" class="ivy-count">0</span>
          </div>
          <div id="exceptionsList" class="ivy-list"></div>
        </section>

        <section class="ivy-section">
          <div class="ivy-section-heading">
            <div>
              <span class="ivy-section-label">Recent Activity</span>
              <h2>Vendor reports</h2>
            </div>
          </div>
          <div id="activityList" class="ivy-list"></div>
        </section>

        <footer class="ivy-footer">
          <span id="signedInAs"></span>
          <button id="signOut" type="button" class="ivy-ghost">Sign out</button>
        </footer>
      </section>
    </main>

    <script src="/ivy.js" defer></script>
  </body>
</html>
